# One way to run sapedb with docker. Edit it to fit where you run it.
#
# Two things worth noting, because both are places where it's easy to get it
# wrong with no visible symptom:
#
# 1. SAPEDB_SECRET is the root of all trust. Whoever holds it can sign a
#    connection string for any account and any database. It must NOT live in
#    this file — here it is read from the environment, and in production use
#    a docker secret or a vault.
#
# 2. The volume must be a real volume. Without mounting one, the database
#    lives in the container's writable layer and disappears with the
#    container, silently, with no warning.
services:
  sapedb:
    image: sapedb:latest
    restart: unless-stopped
    ports:
      - "7433:7433"
    environment:
      SAPEDB_SECRET: ${SAPEDB_SECRET:?set SAPEDB_SECRET in the environment or .env}
      SAPEDB_TLS_CERT: /etc/sapedb/tls/cert.pem
      SAPEDB_TLS_KEY: /etc/sapedb/tls/key.pem
      # Encryption at rest: the key is derived from SAPEDB_SECRET. It protects
      # a disk that gets taken, not against a server that gets compromised —
      # the server can read every database it serves, by design.
      SAPEDB_ENCRYPT: "1"
      SAPEDB_SHUTDOWN: 30s
    volumes:
      - data:/var/lib/sapedb
      - ./tls:/etc/sapedb/tls:ro
    # There is no shell in the image, so the healthcheck has to be something
    # the orchestrator does from the outside. A TCP probe to 7433 is enough to
    # know the port is open; knowing whether the database still answers needs
    # a signed connection string, and that should not live in the healthcheck
    # config.
    stop_grace_period: 40s

volumes:
  data:
